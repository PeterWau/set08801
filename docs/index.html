<!DOCTYPE html>
<html>
<head>
    <title>Povo Golf</title>
    <link rel="stylesheet" href="css/site.css" />
    <script type="module" src="js/pages/index.js"></script>
    <script src="https://cdn.plot.ly/plotly-3.5.0.min.js" charset="utf-8"></script>
</head>
<body>
    <nav>
        <a href="index.html" class="active">Dashboard</a>
        <a href="videos.html">Training Videos</a>
        <a href="practise.html">Practise Sessions</a>
    </nav>

    <header>
        <h1>Dashboard</h1>
        <h3 id="welcome"></h3>
    </header>
    <main>
        <section class="left">
            <form id="register-form">
                <h3>Please Register</h3>
                <div class="form-group">
                    <label for="register">Name:</label>
                    <input id="register-user" maxlength="20" required />
                </div>
                <button id="register" type="button">Register</button>
            </form>
            <h3>Reminders</h3>
                <h4>Please record practice sessions for these clubs:</h3>
                <ul id="dashboard-missing">
                </ul>
        </section>
        <section>
            <h3>Distance Summary</h3>
            <div id="distance-chart" class="chartDistances"></div>
            <!-- <ul dashboard-distances>
            </ul> -->
        </section>
    </main>
    <footer>
        <p id="message">Keep up the great work</p>
    </footer>
</body>
<html>
