<!DOCTYPE html>
<html>
<head>
    <title>Training Videos</title>
    <link rel="stylesheet" href="css/site.css" />
    <script type="module" src="js/pages/videos.js"></script>
</head>
<body>
    <nav>
        <a href="index.html">Dashboard</a>
        <a class="active" href="videos.html">Training Videos</a>
        <a href="practise.html">Practise Sessions</a>
    </nav>
    <header>
        <h1>Training Videos</h1>
        <nav>
            <button id="add-video" type="button">New</button>
            <button id="remove-video" type="button">Remove</button>
            <button id="save-video" type="button">Save</button>              
        </nav>
    </header>
    <main>
        <section>
            <h3>Library</h3>
            <ul id="videos" class="video-library">
            </ul>
        </section>
        <section>
            <h3>Video</h3>
            <form id="video-form">
                <input id="video-id" type="hidden" readonly />
                <div class="form-group">
                    <label for="video-url">Url:</label>    
                    <input id="video-url" name="url" placeholder="Enter Url" maxlength="100" required data-url />
                </div>    
                <div class="form-group">
                    <label for="video-coach">Coach:</label>
                    <input id="video-coach" placeholder="Enter Coach" maxlenth="20" required/>
                </div>
                <div class="form-group">
                    <label for="video-skill">Skill:</label>
                    <input id="video-skill" name="skill" placeholder="Enter skill" maxlength="20" required />
                </div>
            </form>
            <iframe id="player" class="video-player" src="" title="YouTube video player" frameborder="0" allow="" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
    </main>
    <footer>
        <h2 id="message">Keep up the great work</h2>
    </footer>   
</body>
<html>
