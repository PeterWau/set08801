<!DOCTYPE html>
<html>
<head>
    <title>Training Videos</title>
    <link rel="stylesheet" href="css/site.css" />
    <script type="module" src="js/pages/videos.js"></script>
</head>
<body>
    <nav>
        <a href="index.html">Povo Golf</a>
        <a href="dashboard.html">Dashboard</a>
        <a class="active" href="videos.html">Training Videos</a>
        <a href="practice.html">Practice Sessions</a>
        <a href="reports.html">Progress Reports</a>
    </nav>
    <header>
        <h1>Training Videos</h1>
    </header>
    <main>
        <section>
            <h3>Library</h3>
            <ul class="video-library" data-videos>
            </ul>
        </section>
        <section>
            <h3>Video</h3>
            <iframe id="player" class="video-player" src="" title="YouTube video player" frameborder="0" allow="" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
    </main>
    <footer>
        <h3>Edit Video</h3>
        <button type="button" data-new-video>New</button>
        <button type="button" data-remove-video>Remove</button>
        <button type="button" data-save-video>Save</button>    
        <form data-form>
            <input type="hidden" name="id" value="" readonly data-id />
            <label for="data-url">Url:</label>
            <input id="data-url" name="url" data-url maxlength="100" required />
            <label for="data-coach">Coach:</label>
            <input id="data-coach" data-coach maxlenth="20" required/>
            <label for="data-skill">Skill:</label>
            <input id="data-skill" name="skill" data-skill maxlength="20" required />
        </form>
    </footer>   
</body>
<html>
