<!DOCTYPE html>
<html>
<head>
    <title>Practice</title>
    <link rel="stylesheet" href="css/site.css" />
    <script type="module" src="js/pages/practise.js"></script>
</head>
<body>
    <nav>
        <a href="index.html">Povo Golf</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="videos.html">Training Videos</a>
        <a class="active" href="practise.html">Practise Sessions</a>
        <a href="reports.html">Progress Reports</a>
    </nav>

    <header>
        <h1>Practise Sessions</h1>
        <nav>
            <button type="button" data-new>Record</button>
            <button type="button" data-save>Save</button>
        </nav>
    </header>
    <main>
        <section class="left">
            <h3>History</h3>
            <ul data-practises>
            </ul>
        </section>
        <section>
            <h3>Session</h3>
            <input type="hidden" name="id" value="" readonly data-id />
            <label for="data-date">Date:</label>
            <input type="date" id="data-date" name="data-date" data-date>
            <label for="data-skill">Skill:</label>
            <input id="data-skill" name="skill" data-skill maxlength="20" required />
            <label for="data-club">Club:</label>
            <select id="data-club" name="data-club" data-club>
            </select>
            <label for="data-distance">Distance:</label>
            <input id="data-distance" type="number" name="distance" data-distance maxlength="3" required />
            <label for="data-shape">Shape:</label>
            <select id="data-shape" name="shape" data-shape></select>
        </section>
    </main>
    <footer>
        <div data-message>Keep up the great work</div>
    </footer>
</body>
<html>
