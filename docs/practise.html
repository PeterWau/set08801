<body>
    <nav>

    <header>
        <h1>Practise Sessions</h1>
        <nav>
            <button type="button" data-record>Record</button>
            <button type="button" data-record>Save</button>
        </nav>
    </header>
    <main>
        <section class="left">
            <h3>History</h3>
            <ul data-practises>
                <li>01 Apr 2026 - square takeaway</li>
                <li>02 Apr 2026 - putting</li>
            </ul>
        </section>
        <section>
            <h3>Session</h3>
            <input type="hidden" name="id" value="" readonly data-id />
            <label for="data-skill">Skill:</label>
            <input id="data-skill" name="skill" data-skill maxlength="20" required />
        </section>
    </main>
    <footer>
        <div>Messages</div>
        <div>More Messages</div>
    </footer>
