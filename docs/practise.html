<!DOCTYPE html>
<html>
<head>
    <title>Practice</title>
    <link rel="stylesheet" href="css/site.css" />
    <script type="module" src="js/pages/practise.js"></script>
</head>
<body>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="videos.html">Training Videos</a>
        <a class="active" href="practise.html">Practise Sessions</a>
    </nav>

    <header>
        <h1>Practise Sessions</h1>
        <nav>
            <button id="practise-add" type="button">Record</button>
            <button id="practise-remove" type="button">Remove</button>
            <button id="practise-save" type="button">Save</button>
        </nav>
    </header>
    <main>
        <section class="left">
            <h3>History</h3>
            <ul id="practises">
            </ul>
        </section>
        <section>
            <h3>Session</h3>
            <form>
                <input id="data-id" type="hidden" name="id" value="" readonly />
                <div class="form-group">
                    <label for="data-date">Date:</label>
                    <input id="data-date" type="date">
                </div>
                <div class="form-group">
                    <label for="data-skill">Skill:</label>
                    <input id="data-skill" name="skill" maxlength="20" required />
                </div>
                <div class="form-group">    
                    <label for="data-club">Club:</label>
                    <select id="data-club" name="data-club"></select>
                </div>
                <div class="form-group">
                    <label for="data-distance">Distance:</label>
                    <input id="data-distance" type="number" name="distance" maxlength="3" required />
                </div>
                <div class="form-group">
                    <label for="data-shape">Shape:</label>
                    <select id="data-shape" name="shape"></select>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <h3 id="message">Keep up the great work</h3>
    </footer>
</body>
<html>
